services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: nuvortiq
      POSTGRES_PASSWORD: nuvortiq_dev_only
      POSTGRES_DB: nuvortiq
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuvortiq -d nuvortiq"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
